services:
  postgres:
    image: postgres:16-alpine
    container_name: omflix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-omflix}
      POSTGRES_USER: ${DATABASE_USER:-omflix}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-omflix} -d ${DATABASE_NAME:-omflix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omflix

  redis:
    image: redis:7-alpine
    container_name: omflix-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omflix

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  omflix:
    name: omflix-network
    driver: bridge
