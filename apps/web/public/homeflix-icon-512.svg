<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="iconRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2430" />
      <stop offset="100%" stop-color="#B80610" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E50914" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#262626" stroke-width="3" fill="none"/>

  <!-- House + Play Icon -->
  <g filter="url(#iconGlow)">
    <!-- House silhouette -->
    <path d="M256 96 L80 236 L108 260 L128 244 L128 388 C128 401.2 138.8 412 152 412 L360 412 C373.2 412 384 401.2 384 388 L384 244 L404 260 L432 236 Z" fill="url(#iconRedGrad)"/>
    <!-- Play Triangle cutout -->
    <polygon points="230,240 230,340 315,290" fill="#0A0A0A"/>
  </g>
</svg>
