<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none">
  <defs>
    <linearGradient id="hfRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B80610" />
    </linearGradient>
    <filter id="hfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E50914" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- House + Play Icon -->
  <g filter="url(#hfGlow)">
    <!-- House outline/body -->
    <path d="M22 4 L4 18 L7.5 21 L10 19 L10 37 C10 38.65 11.35 40 13 40 L31 40 C32.65 40 34 38.65 34 37 L34 19 L36.5 21 L40 18 Z" fill="url(#hfRedGrad)"/>
    <!-- Play Triangle cutout inside house -->
    <polygon points="19,19 19,33 30,26" fill="#0A0A0A"/>
  </g>

  <!-- HOMEFLIX Wordmark -->
  <text x="48" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">HOME</tspan><tspan fill="#E50914">FLIX</tspan>
  </text>
</svg>
